<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Lime Backlight Rim Glow -->
    <radialGradient id="limeRimGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ccff00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0" />
    </radialGradient>

    <!-- Head & Shoulders Silhouette Gradient -->
    <linearGradient id="silhouetteGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2a36" />
      <stop offset="40%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0c0c12" />
    </linearGradient>

    <!-- Subtle Lime Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ccff00" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#2a2a36" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Geometric Grid Background Pattern -->
    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#272732" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Pure Transparent Portrait Layer (No opaque background rect) -->

  <!-- Radial Lime Ambient Aura -->
  <circle cx="300" cy="280" r="240" fill="url(#limeRimGlow)" />

  <!-- Architectural Frame Guides (M7MD Aesthetic) -->
  <circle cx="300" cy="280" r="210" fill="none" stroke="#272732" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="300" cy="280" r="260" fill="none" stroke="#ccff00" stroke-opacity="0.15" stroke-width="1" />

  <!-- Silhouette Composition: Shoulders, Torso, Neck, Head -->
  <g id="portrait-silhouette">
    <!-- Outer Rim Stroke Layer -->
    <path d="M 120 750 C 120 620 180 540 230 500 C 240 450 250 420 250 370 C 220 350 210 300 210 250 C 210 160 250 110 300 110 C 350 110 390 160 390 250 C 390 300 380 350 350 370 C 350 420 360 450 370 500 C 420 540 480 620 480 750 Z" 
          fill="none" stroke="url(#rimStroke)" stroke-width="3" filter="drop-shadow(0 0 10px rgba(204,255,0,0.3))" />

    <!-- Main Silhouette Solid Body -->
    <path d="M 120 750 C 120 620 180 540 230 500 C 240 450 250 420 250 370 C 220 350 210 300 210 250 C 210 160 250 110 300 110 C 350 110 390 160 390 250 C 390 300 380 350 350 370 C 350 420 360 450 370 500 C 420 540 480 620 480 750 Z" 
          fill="url(#silhouetteGrad)" />

    <!-- Stylized Facial Contour Lines (Minimalist Silhouette) -->
    <path d="M 285 240 C 290 270 300 280 310 285" stroke="#ccff00" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 290 315 C 300 320 310 320 320 315" stroke="#3f3f50" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 270 215 C 285 210 300 215 305 218" stroke="#3f3f50" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 330 218 C 335 215 350 210 365 215" stroke="#ccff00" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Modern Designer Headphones Around Neck -->
    <path d="M 235 430 C 220 460 240 500 270 505 C 290 508 310 508 330 505 C 360 500 380 460 365 430" fill="none" stroke="#2a2a3a" stroke-width="16" stroke-linecap="round" />
    <path d="M 235 430 C 220 460 240 500 270 505 C 290 508 310 508 330 505 C 360 500 380 460 365 430" fill="none" stroke="#ccff00" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- High-Tech Framing Accents -->
  <g opacity="0.7">
    <!-- Top Left Crosshair -->
    <path d="M 40 50 L 40 70 M 40 50 L 60 50" stroke="#ccff00" stroke-width="2" />
    <text x="40" y="90" fill="#71717a" font-family="'Plus Jakarta Sans', monospace" font-size="10" letter-spacing="2">PORTRAIT // PLACEHOLDER</text>
    
    <!-- Bottom Right Frame Badge -->
    <path d="M 560 700 L 560 680 M 560 700 L 540 700" stroke="#ccff00" stroke-width="2" />
    <text x="560" y="720" text-anchor="end" fill="#a1a1aa" font-family="'Plus Jakarta Sans', monospace" font-size="10" letter-spacing="1">M7MD.DSGN CREATIVE LAB</text>
  </g>
</svg>
