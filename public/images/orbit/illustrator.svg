<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Drop Shadow -->
    <filter id="shadowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF9A00" flood-opacity="0.25" />
    </filter>

    <!-- 3D Dark Glass Bevel -->
    <linearGradient id="glassBorderAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A00" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ccff00" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#241a12" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#140b02" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep Glass Body Surface -->
    <linearGradient id="glassBodyAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20140b" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#120a04" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#070301" stop-opacity="1" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glossAi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- AI Brand Amber Glow -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9A00" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FF9A00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shadow Base -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#000" filter="url(#shadowAi)" />

  <!-- Outer Glass Rim -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#glassBorderAi)" />

  <!-- Inner Dark Tile Body -->
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#glassBodyAi)" />

  <!-- Radial Amber Core Ambient -->
  <circle cx="50" cy="50" r="32" fill="url(#aiGlow)" />

  <!-- Upper Glass Sheen -->
  <path d="M 14 30 C 14 18 20 14 32 14 L 68 14 C 80 14 86 18 86 30 C 86 42 70 48 50 48 C 30 48 14 42 14 30 Z" fill="url(#glossAi)" />

  <!-- Lime Accent Reflection on Corner -->
  <circle cx="22" cy="22" r="2" fill="#ccff00" opacity="0.9" filter="drop-shadow(0 0 3px #ccff00)" />

  <!-- Illustrator 'Ai' Glyph -->
  <g id="ai-glyph" transform="translate(23, 25)">
    <!-- A -->
    <path d="M 14 12 L 23 36 L 17 36 L 15 30 L 7 30 L 5 36 L 0 36 L 9 12 Z M 8.5 25.5 L 13.5 25.5 L 11 18 Z" fill="#FF9A00" />
    <!-- i -->
    <circle cx="33" cy="15" r="3" fill="#FF9A00" />
    <path d="M 30.5 21 L 35.5 21 L 35.5 36 L 30.5 36 Z" fill="#FF9A00" />
  </g>
</svg>
