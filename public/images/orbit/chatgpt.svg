<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Drop Shadow -->
    <filter id="shadowGpt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10A37F" flood-opacity="0.3" />
    </filter>

    <!-- 3D Dark Glass Bevel -->
    <linearGradient id="glassBorderGpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ccff00" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#10241c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#02140d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep Glass Body Surface -->
    <linearGradient id="glassBodyGpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e16" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#05120c" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#010604" stop-opacity="1" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glossGpt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- OpenAI Brand Emerald Glow -->
    <radialGradient id="gptGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10A37F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shadow Base -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#000" filter="url(#shadowGpt)" />

  <!-- Outer Glass Rim -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#glassBorderGpt)" />

  <!-- Inner Dark Tile Body -->
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#glassBodyGpt)" />

  <!-- Radial Emerald Core Ambient -->
  <circle cx="50" cy="50" r="32" fill="url(#gptGlow)" />

  <!-- Upper Glass Sheen -->
  <path d="M 14 30 C 14 18 20 14 32 14 L 68 14 C 80 14 86 18 86 30 C 86 42 70 48 50 48 C 30 48 14 42 14 30 Z" fill="url(#glossGpt)" />

  <!-- Lime Accent Reflection on Corner -->
  <circle cx="22" cy="22" r="2" fill="#ccff00" opacity="0.9" filter="drop-shadow(0 0 3px #ccff00)" />

  <!-- ChatGPT / OpenAI Spiral Flower Glyph -->
  <g id="chatgpt-glyph" transform="translate(26, 26) scale(1.95)">
    <path d="M22.28 9.87a5.98 5.98 0 0 0-.52-4.91 6.05 6.05 0 0 0-6.52-2.82 6 6 0 0 0-4.64-2.14 6.04 6.04 0 0 0-5.8 4.3 6.02 6.02 0 0 0-3.9 2.82 6.06 6.06 0 0 0 .74 7.07 5.98 5.98 0 0 0 .52 4.9 6.05 6.05 0 0 0 6.52 2.83 6.01 6.01 0 0 0 4.64 2.14 6.04 6.04 0 0 0 5.8-4.3 6.02 6.02 0 0 0 3.9-2.82 6.06 6.06 0 0 0-.74-7.07ZM12 13.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="#10A37F" />
  </g>
</svg>
