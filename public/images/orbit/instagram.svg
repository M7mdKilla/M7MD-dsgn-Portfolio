<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Drop Shadow -->
    <filter id="shadowIg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E1306C" flood-opacity="0.3" />
    </filter>

    <!-- 3D Dark Glass Bevel -->
    <linearGradient id="glassBorderIg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#ccff00" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#28101a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14040a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep Glass Body Surface -->
    <linearGradient id="glassBodyIg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220e18" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#12060c" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#050103" stop-opacity="1" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glossIg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Instagram Gradient -->
    <linearGradient id="igGlyphGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="15%" stop-color="#fdf497" />
      <stop offset="40%" stop-color="#fd5949" />
      <stop offset="65%" stop-color="#d6249f" />
      <stop offset="100%" stop-color="#285AEB" />
    </linearGradient>

    <radialGradient id="igGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1306C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E1306C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shadow Base -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#000" filter="url(#shadowIg)" />

  <!-- Outer Glass Rim -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#glassBorderIg)" />

  <!-- Inner Dark Tile Body -->
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#glassBodyIg)" />

  <!-- Radial Core Ambient -->
  <circle cx="50" cy="50" r="32" fill="url(#igGlow)" />

  <!-- Upper Glass Sheen -->
  <path d="M 14 30 C 14 18 20 14 32 14 L 68 14 C 80 14 86 18 86 30 C 86 42 70 48 50 48 C 30 48 14 42 14 30 Z" fill="url(#glossIg)" />

  <!-- Lime Accent Reflection on Corner -->
  <circle cx="22" cy="22" r="2" fill="#ccff00" opacity="0.9" filter="drop-shadow(0 0 3px #ccff00)" />

  <!-- Instagram Camera Glyph -->
  <g id="ig-glyph" transform="translate(28, 28) scale(1.85)" stroke="url(#igGlyphGrad)" stroke-width="2.2" fill="none">
    <rect x="2" y="2" width="20" height="20" rx="5.5" ry="5.5" />
    <circle cx="12" cy="12" r="4.2" />
    <circle cx="17.5" cy="6.5" r="0.8" fill="url(#igGlyphGrad)" stroke="none" />
  </g>
</svg>
