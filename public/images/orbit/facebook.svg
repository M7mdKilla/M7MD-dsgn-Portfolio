<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Drop Shadow -->
    <filter id="shadowFb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1877F2" flood-opacity="0.3" />
    </filter>

    <!-- 3D Dark Glass Bevel -->
    <linearGradient id="glassBorderFb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ccff00" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#0e1b2e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#020a16" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep Glass Body Surface -->
    <linearGradient id="glassBodyFb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#060d18" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#010307" stop-opacity="1" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glossFb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Facebook Blue Glow -->
    <radialGradient id="fbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shadow Base -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#000" filter="url(#shadowFb)" />

  <!-- Outer Glass Rim -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="url(#glassBorderFb)" />

  <!-- Inner Dark Tile Body -->
  <rect x="12" y="12" width="76" height="76" rx="20" fill="url(#glassBodyFb)" />

  <!-- Radial Core Ambient -->
  <circle cx="50" cy="50" r="32" fill="url(#fbGlow)" />

  <!-- Upper Glass Sheen -->
  <path d="M 14 30 C 14 18 20 14 32 14 L 68 14 C 80 14 86 18 86 30 C 86 42 70 48 50 48 C 30 48 14 42 14 30 Z" fill="url(#glossFb)" />

  <!-- Lime Accent Reflection on Corner -->
  <circle cx="22" cy="22" r="2" fill="#ccff00" opacity="0.9" filter="drop-shadow(0 0 3px #ccff00)" />

  <!-- Facebook 'f' Glyph -->
  <g id="fb-glyph" transform="translate(32, 24) scale(1.5)">
    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2" />
  </g>
</svg>
